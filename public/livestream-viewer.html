<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chatroom</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font: 15px system-ui, sans-serif; background: #f6f8fa; color: #1f2328; display: flex; flex-direction: column; height: 100vh; max-width: 720px; margin-inline: auto; }
  header { padding: 12px 16px; border-bottom: 1px solid #d0d7de; display: flex; justify-content: space-between; }
  #log { flex: 1; overflow: auto; padding: 12px 16px; }
  .m { margin: 6px 0; } .viewer b { color: #0969da; } .avatar { color: #1a7f37; } .avatar.interim { color: #8c959f; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #d0d7de; background: #fff; }
  input { flex: 1; padding: 10px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 15px; }
  #name { flex: 0 0 120px; }
  button { padding: 10px 14px; border: 0; border-radius: 6px; background: #0969da; color: #fff; font-size: 15px; }
</style>
</head>
<body>
<header><strong>Live chat</strong><span id="viewers">connecting…</span></header>
<div id="log"></div>
<form id="f"><input id="name" placeholder="name" maxlength="24"><input id="text" placeholder="Say something (end with ? to ask the host)" maxlength="300" autocomplete="off"><button>Send</button></form>
<script>
  const $ = (id) => document.getElementById(id);
  const names = ['mika', 'tom', 'aya', 'leo', 'sam', 'jin'];
  $('name').value = localStorage.getItem('chat-name') || names[Math.floor(Math.random() * names.length)];
  const log = $('log'); const interim = new Map();
  function add(cls, html, id) {
    let d = id && interim.get(id);
    if (!d) { d = document.createElement('div'); log.appendChild(d); if (id) interim.set(id, d); }
    d.className = 'm ' + cls; d.innerHTML = html; log.scrollTop = 1e9;
  }
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  function render(m) {
    if (m.role === 'viewer') add('viewer', `<b>${esc(m.name)}</b> ${esc(m.text)}`);
    else if (m.role === 'avatar') add('avatar' + (m.final ? '' : ' interim'), `<b>host</b> ${esc(m.text)}`, m.id);
  }
  let ws;
  function connect() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/?usecase=livestream&role=viewer`);
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'history') msg.transcript.forEach(render);
      else if (msg.type === 'chat' || msg.type === 'caption') render(msg);
      else if (msg.type === 'viewers') $('viewers').textContent = `${msg.count} watching`;
    };
    ws.onclose = () => setTimeout(connect, 1500);
  }
  connect();
  $('f').onsubmit = (e) => {
    e.preventDefault();
    const text = $('text').value.trim(); if (!text) return;
    localStorage.setItem('chat-name', $('name').value);
    ws.send(JSON.stringify({ type: 'chat', name: $('name').value || 'viewer', text }));
    $('text').value = '';
  };
</script>
</body>
</html>
