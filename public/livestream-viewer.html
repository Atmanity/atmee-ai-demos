<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat · Nightcap Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>if (new URLSearchParams(location.search).get('role') === 'streamer') location.replace('livestream-host.html');</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
  :root {
    --bg: #0c0b10; --surface: #16141d; --surface-2: #211e2b; --text: #f2f0f7; --muted: #9b96ad; --line: #2a2735;
    --accent: #ff3d81; --accent-ink: #fff; --accent-soft: rgb(255 61 129 / .14); --stage: #050407;
    --font: "Space Grotesk", system-ui, sans-serif; color-scheme: dark;
  }
  body { display: flex; flex-direction: column; height: 100vh; max-width: 560px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--surface); }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #ff3d81, #7c3aed); flex: none; }
  header .t { flex: 1; min-width: 0; }
  header b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header span.sub { color: var(--muted); font-size: 13px; }
  .chip.live { background: #e5384f; color: #fff; }
  /* Streamer / Viewer: the same switch on both Nightcap pages */
  .mode { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
  .mode a { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .mode a:hover { color: var(--text); }
  .mode a[aria-current] { background: var(--accent); color: var(--accent-ink); }
  /* The stream, as the studio forwards it */
  .player { flex: none; margin: 12px 16px 0; aspect-ratio: 16 / 9; }
  .player video { object-fit: contain; }
  .player .overlay .title { font-size: 17px; }
  .hud { position: absolute; top: 10px; left: 10px; z-index: 3; display: flex; gap: 6px; }
  .hud .chip { background: rgb(0 0 0 / .55); color: #fff; }
  .hud .chip.live { background: #e5384f; }
  .unmute { position: absolute; right: 10px; bottom: 10px; z-index: 3; padding: 8px 14px; font-size: 14px; }
  .pinned { margin: 12px 16px 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { line-height: 1.4; overflow-wrap: anywhere; animation: rise .2s ease-out; }
  .msg b { margin-right: 6px; }
  .msg.me b { color: #a78bfa; }
  .msg.host { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 8px; }
  .msg.host b { color: var(--accent); }
  .msg.host.live { opacity: .7; }
  .colors b { color: var(--c); }
  form { display: grid; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  .who { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .who input { background: transparent; border: 0; border-bottom: 1px dashed var(--line); color: var(--text); width: 140px; padding: 2px 0; outline: none; }
</style>
</head>
<body>
<header>
  <div class="av"></div>
  <div class="t"><b>Late-night tech talk with your AI co-host</b><span class="sub" id="viewers">Connecting…</span></div>
  <nav class="mode" aria-label="Join as"><a href="livestream-host.html">Streamer</a><a href="livestream-viewer.html" aria-current="page">Viewer</a></nav>
</header>
<div class="stage player no-face" id="player">
  <div class="hud"><span class="chip" id="badge">OFFLINE</span></div>
  <video id="video" autoplay playsinline muted></video>
  <button class="btn primary unmute" id="unmute" type="button" hidden>🔇 Tap to unmute</button>
  <div class="overlay" id="overlay"></div>
</div>
<div class="pinned">📌 End a message with “?” to ask the host directly. Everything else, the host catches up on every few seconds.</div>
<div class="pin" id="pin" hidden></div>
<div class="poll" id="poll" hidden></div>
<div id="log"></div>
<form id="f">
  <div class="composer"><input id="text" placeholder="Send a message" maxlength="300" autocomplete="off"><button class="icon-btn" id="send" aria-label="Send"></button></div>
  <label class="who">Chatting as <input id="name" maxlength="24"></label>
</form>
<script src="kit.js"></script>
<script src="livestream-relay.js"></script>
<script>
  const { $, esc, icon } = UI;
  $('send').innerHTML = icon.send;
  const NAMES = ['mika', 'tom', 'aya', 'leo', 'sam', 'jin', 'noor', 'kai'];
  let saved = null; try { saved = localStorage.getItem('nightcap-name'); } catch (e) {}
  $('name').value = saved || NAMES[Math.floor(Math.random() * NAMES.length)] + Math.floor(Math.random() * 90 + 10);
  const color = (n) => `hsl(${[...n].reduce((a, c) => a + c.charCodeAt(0), 0) * 47 % 360} 80% 70%)`;
  const live = new Map();
  function render(m) {
    if (m.role === 'viewer') {
      const d = document.createElement('div'); d.className = 'msg' + (m.name === $('name').value ? ' me' : '');
      d.innerHTML = `<b style="color:${m.name === $('name').value ? '' : color(m.name)}">${esc(m.name)}</b>${esc(m.text)}`; $('log').appendChild(d);
    } else if (m.role === 'avatar') {
      let d = m.id && live.get(m.id);
      if (!d) { d = document.createElement('div'); $('log').appendChild(d); if (m.id) live.set(m.id, d); }
      d.className = 'msg host' + (m.final ? '' : ' live'); d.innerHTML = `<b>Host</b>${esc(m.text)}`;
    }
    $('log').scrollTop = 1e9;
  }
  // What the host pins and the polls it starts (its app tools), from the server.
  let lastPoll = null, myVote = null;
  function showPoll(m) {
    if (!lastPoll || lastPoll.id !== m.id) myVote = null;
    lastPoll = m;
    UI.poll($('poll'), m, (i) => { myVote = i; ws.send(JSON.stringify({ type: 'vote', option: i, name: $('name').value.trim() || 'viewer' })); }, myVote);
  }
  setInterval(() => { if (lastPoll && lastPoll.open) showPoll(lastPoll); }, 1000);
  // The stream: the studio page forwards the avatar's video and voice to this
  // page (it is the only one in the room). The video starts muted, since a
  // browser plays sound only after a tap; one tap unmutes it for the visit.
  const video = $('video');
  let wantSound = false;
  function overlay(html) { $('overlay').hidden = !html; $('overlay').innerHTML = html ? `<div class="inner">${html}</div>` : ''; }
  function showStream(state, d) {
    const live = state === 'playing' || state === 'tuning';
    $('badge').textContent = live ? '● LIVE' : state === 'full' ? 'FULL' : 'OFFLINE'; $('badge').className = live ? 'chip live' : 'chip';
    if (state === 'offline') overlay('<div class="title">The stream is offline</div><div class="detail">It shows up here as soon as the creator goes live. The chat stays open.</div>');
    else if (state === 'tuning') overlay('<div class="spinner"></div><div class="title">Tuning in…</div><div class="detail">Connecting to the stream.</div>');
    else if (state === 'full') overlay(`<div class="title">The stream is full</div><div class="detail">${d.max || 'The most'} people are already watching, and each one costs the studio upload. You can still chat; you get in as soon as a spot opens.</div>`);
    else overlay('');
    $('unmute').hidden = state !== 'playing' || !video.muted;
  }
  video.addEventListener('resize', () => $('player').classList.toggle('no-face', !video.videoWidth));
  video.addEventListener('emptied', () => $('player').classList.add('no-face'));
  video.addEventListener('playing', () => {
    $('player').classList.toggle('no-face', !video.videoWidth);
    if (wantSound) { video.muted = false; video.play().catch(() => { video.muted = true; $('unmute').hidden = false; }); }
  });
  function unmute() { wantSound = true; video.muted = false; video.play().catch(() => {}); $('unmute').hidden = true; }
  $('unmute').onclick = unmute;
  $('player').addEventListener('click', (e) => { if (video.muted && video.srcObject && e.target === video) unmute(); });
  const watch = StreamRelay.viewer({ video, send: (m) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }, onState: showStream });
  window.__watch = watch; // for checks: watch.pc is the receiving connection
  showStream('offline');

  let ws;
  function connect() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/?usecase=livestream&role=viewer`);
    ws.onopen = () => watch.connected();
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (watch.handle(msg)) return;
      if (msg.type === 'history') msg.transcript.forEach(render);
      else if (msg.type === 'chat' || msg.type === 'caption') render(msg);
      else if (msg.type === 'viewers') $('viewers').textContent = `${msg.count} watching`;
      else if (msg.type === 'pin') { $('pin').hidden = false; $('pin').innerHTML = `<b>📌 Pinned by the host</b>${esc(msg.text)}`; }
      else if (msg.type === 'poll') showPoll(msg);
    };
    ws.onclose = () => { watch.disconnected(); $('viewers').textContent = 'Reconnecting…'; setTimeout(connect, 1500); };
  }
  connect();
  $('f').onsubmit = (e) => {
    e.preventDefault();
    const text = $('text').value.trim(); if (!text || ws.readyState !== 1) return;
    const name = $('name').value.trim() || 'viewer';
    try { localStorage.setItem('nightcap-name', name); } catch (e) {}
    ws.send(JSON.stringify({ type: 'chat', name, text }));
    $('text').value = '';
  };
</script>
</body>
</html>
