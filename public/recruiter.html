<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screening call</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="demo.css">
</head>
<body class="light">
<div id="stage"><video id="video" autoplay playsinline></video><audio id="audio" autoplay></audio><div id="caption"></div></div>
<div id="side">
  <div id="status">A regular back-and-forth interview. The recruiter follows an agenda set through the conductor API: greet → background → must-haves → logistics → your questions → wrap.</div>
  <div id="panel">
    <label>Your name <input id="name" value="Alex Chen" maxlength="40"></label>
    <div><button id="start">Join the call (microphone)</button><button id="startTyped" class="secondary">Join by typing only</button></div>
  </div>
  <div id="log"></div>
  <form class="typed" id="f"><input id="text" placeholder="Type an answer instead of speaking…" maxlength="500" autocomplete="off" disabled><button disabled id="send">Send</button></form>
</div>
<script src="https://unpkg.com/livekit-client@2.9.5/dist/livekit-client.umd.js"></script>
<script src="common.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const log = (cls, text) => { const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text; $('log').appendChild(d); $('log').scrollTop = 1e9; };
  let s;
  async function start(mic) {
    $('start').disabled = $('startTyped').disabled = true; $('status').textContent = 'Starting the recruiter…';
    try {
      s = await Atmee.join({
        usecase: 'recruiter', video: $('video'), audio: $('audio'), mic,
        onCaption: (text, final) => { $('caption').textContent = text; if (final) log('avatar', `recruiter: ${text}`); },
        onRelay: (topic, text) => log('relay', `→ ${topic}: ${text.slice(0, 140)}`),
        onEnd: () => { $('status').textContent = 'Call ended.'; $('text').disabled = $('send').disabled = true; },
      });
      s.user('name', $('name').value.trim() || 'the candidate');
      $('status').textContent = `In the call, room ${s.session.roomName}${mic ? '' : ' (typing only)'}`;
      $('text').disabled = $('send').disabled = false;
    } catch (e) { $('status').textContent = `Could not start: ${e.message}`; $('start').disabled = $('startTyped').disabled = false; }
  }
  $('start').onclick = () => start(true);
  $('startTyped').onclick = () => start(false);
  $('f').onsubmit = (e) => { e.preventDefault(); const t = $('text').value.trim(); if (!t || !s) return; log('user', `you: ${t}`); s.user('typed', t); $('text').value = ''; };
  window.addEventListener('beforeunload', () => navigator.sendBeacon('/api/recruiter/session/end'));
</script>
</body>
</html>
